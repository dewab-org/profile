"$schema" = 'https://starship.rs/config-schema.json'

# No leading blank line before the prompt: keeps iTerm2's shell-integration
# prompt mark sitting cleanly at the prompt start instead of on a blank line.
add_newline = false

# Allow longer directory scans before giving up (default 30ms); avoids the
# "Scanning current directory timed out" warning in busy dirs like /tmp.
scan_timeout = 100

format = """
[](fg:surface0)\
$os\
$username\
${env_var.STARSHIP_HOST_LOCAL}\
${env_var.STARSHIP_HOST_SSH}\
${custom.directory_icon}\
$directory\
${custom.git_provider}\
$git_branch\
$git_commit\
$git_state\
$git_status\
$python\
$terraform\
[ ](fg:surface0)\
$cmd_duration\
$status\
$line_break\
$character"""

right_format = "$kubernetes"

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "bg:surface0 fg:text"

