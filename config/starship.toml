[username]
show_always = false
style_user = "bg:surface0 fg:overlay1"
style_root = "bold bg:surface0 fg:red"
format = '[ ](fg:overlay0 bg:surface0)[ $user]($style)'

# Hostname via env_var modules (exported once by starship.prompt) rather than
# custom modules: env_var renders in-process, custom spawned `sh -c hostname`
# every prompt. STARSHIP_HOST_LOCAL is set for local shells, STARSHIP_HOST_SSH
# inside ssh sessions — same conditionality as the old `when` clauses.
[env_var.STARSHIP_HOST_LOCAL]
variable = "STARSHIP_HOST_LOCAL"
style = "bg:surface0 fg:overlay1"
format = '[ ](fg:overlay0 bg:surface0)[ $env_value]($style)'

[env_var.STARSHIP_HOST_SSH]
variable = "STARSHIP_HOST_SSH"
style = "bold bg:surface0 fg:red"
format = '[ ](fg:overlay0 bg:surface0)[  $env_value]($style)'

[directory]
style = "bold bg:surface0 fg:blue"
format = '[ $path]($style)'
truncate_to_repo = false
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = " 󰌾"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[custom.directory_icon]
command = '''
case "${PWD}" in
  "${HOME}"|"${HOME}"/*) printf '' ;;
  *) printf '' ;;
esac
'''
when = true
shell = ["sh"]
style = "bg:surface0 fg:blue"
format = '[ ](fg:overlay0 bg:surface0)[ $output]($style)'

[custom.git_provider]
command = '''
remote_url=$(git remote get-url origin 2>/dev/null || git remote get-url "$(git remote | head -n 1)" 2>/dev/null)
case "${remote_url}" in
  *github.com*) printf '' ;;
  *gitlab.com*) printf '' ;;
  *bitbucket.org*) printf '' ;;
  *) printf '' ;;
esac
'''
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"
shell = ["sh"]
style = "bg:surface0 fg:green"
format = '[ ](fg:overlay0 bg:surface0)[ $output]($style)'

[git_branch]
symbol = " "
style = "bg:surface0 fg:green"
format = '[ $symbol$branch(:$remote_branch)]($style)'
truncation_length = 32
truncation_symbol = "…"

[git_commit]
commit_hash_length = 8
only_detached = true
tag_disabled = false
tag_symbol = "  "
style = "bg:surface0 fg:green"
format = '[ @${hash}${tag}]($style)'

[git_state]
rebase = "rebase"
merge = "merge"
revert = "revert"
cherry_pick = "cherry-pick"
bisect = "bisect"
am = "am"
am_or_rebase = "am/rebase"
style = "bg:surface0 fg:red"
format = '[ $state( $progress_current/$progress_total)]($style)'

[git_status]
style = "bg:surface0 fg:yellow"
format = '[$all_status$ahead_behind]($style)'
conflicted = '[ ~${count}](fg:red bg:surface0)'
ahead = '[ ⇡${count}](fg:green bg:surface0)'
behind = '[ ⇣${count}](fg:green bg:surface0)'
diverged = '[ ⇣${behind_count}⇡${ahead_count}](fg:green bg:surface0)'
up_to_date = ""
untracked = '[ ?${count}](fg:blue bg:surface0)'
stashed = '[ *${count}](fg:green bg:surface0)'
modified = '[ !${count}](fg:yellow bg:surface0)'
staged = '[ +${count}](fg:yellow bg:surface0)'
renamed = '[ »${count}](fg:yellow bg:surface0)'
deleted = '[ ✘${count}](fg:red bg:surface0)'
typechanged = '[ ≋${count}](fg:yellow bg:surface0)'

